services:
  - type: web
    name: sisbov-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_web:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: false

databases:
  - name: sisbov-db
    plan: free
    databaseName: sisbov
    user: sisbov
