services:
  - type: web
    name: sisbov-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_web:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
        # IMPORTANTE: Configure a URL do Neon manualmente no painel do Render
        # Formato: postgresql://usuario:senha@host/database?sslmode=require
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: false
